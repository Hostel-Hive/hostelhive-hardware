; PlatformIO Project Configuration File
; HostelHive ESP32 QR Scanner & Gate Controller Firmware
; Academic Reference: SENG 34213 - System Development Project
; Design Reference: HostelHive SDS Section 7.5.3 (IoT Deployment)

[platformio]
default_envs = esp32dev
description = HostelHive IoT Gate Attendance Scanner & Simulation Node

[env:esp32dev]
platform = espressif32 @ 6.3.2
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D SIMULATION_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Dependent Libraries
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    bblanchon/ArduinoJson @ ^6.21.2

; Flash file system configuration (LittleFS / SPIFFS)
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Physical gate build: no USB-serial QR input, insecure HTTP forced off.
[env:esp32prod]
extends = env:esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D SIMULATION_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

; NodeMCU V3 (ESP8266, CH340) gate: RC522 RFID reader, passive buzzer, no OLED.
; Cards carry the student's HH1 pass (see include/card_format.h); write one with
; the "provision" serial command. Upload: pio run -e nodemcu --target upload
[env:nodemcu]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Clone CH340 chips on NodeMCU V3 boards are unreliable at higher speeds.
upload_speed = 115200
; 160 MHz roughly halves the BearSSL handshake time.
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D SIMULATION_MODE=0
    -D HAS_OLED=0
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.2
    miguelbalboa/MFRC522 @ ^1.4.11

; Bench testing on the NodeMCU: also accepts HH1 passes typed into the serial
; monitor, and plain http:// to a LAN backend when ALLOW_INSECURE_HTTP is 1.
[env:nodemcu_dev]
extends = env:nodemcu
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D SIMULATION_MODE=1
    -D HAS_OLED=0

[env:native_test]
platform = native
test_framework = unity
build_flags = 
    -D UNIT_TEST=1
    -D SIMULATION_MODE=1
    -std=c++14
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.2
