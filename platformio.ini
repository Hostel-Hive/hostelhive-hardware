; PlatformIO Project Configuration File
; HostelHive ESP32 QR Scanner & Gate Controller Firmware
; Academic Reference: SENG 34213 - System Development Project
; Design Reference: HostelHive SDS Section 7.5.3 (IoT Deployment)

[platformio]
default_envs = esp32dev
description = HostelHive IoT Gate Attendance Scanner & Simulation Node

[env:esp32dev]
platform = espressif32 @ 6.3.2
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D SIMULATION_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Dependent Libraries
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    bblanchon/ArduinoJson @ ^6.21.2

; Flash file system configuration (LittleFS / SPIFFS)
board_build.filesystem = littlefs
board_build.partitions = default.csv

[env:native_test]
platform = native
test_framework = unity
build_flags = 
    -D UNIT_TEST=1
    -D SIMULATION_MODE=1
